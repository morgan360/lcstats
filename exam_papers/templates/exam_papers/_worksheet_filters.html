{% comment %}
  The subject and topic pickers above a worksheet grid. Shared by the question
  page and the parts page, which differ only in what the "no topic" option
  counts. Needs: subjects, topics, selected_subject_id, selected_topic_id,
  untagged_count and untagged_noun.
{% endcomment %}
<div class="mt-8 flex flex-col sm:flex-row gap-4 items-end rounded-xl border border-mist/10 bg-twilight p-5">
    <div class="flex flex-col gap-1 flex-1">
        <label for="subject-select" class="text-sm font-semibold text-mist">Subject</label>
        <select id="subject-select" onchange="filterChanged()"
            class="rounded-lg border border-mist/20 px-3 py-2 text-sm"
            style="background: rgba(0,28,61,0.5); color: #F0EFEB;">
            <option value="">All Subjects</option>
            {% for subject in subjects %}
            <option value="{{ subject.id }}" {% if selected_subject_id == subject.id %}selected{% endif %}>
                {{ subject.name }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="flex flex-col gap-1 flex-1">
        <label for="topic-select" class="text-sm font-semibold text-mist">Topic</label>
        <select id="topic-select" onchange="filterChanged()"
            class="rounded-lg border border-mist/20 px-3 py-2 text-sm"
            style="background: rgba(0,28,61,0.5); color: #F0EFEB;">
            <option value="">-- Select a topic --</option>
            {% for topic in topics %}
            <option value="{{ topic.id }}" {% if selected_topic_id == topic.id|stringformat:"d" %}selected{% endif %}>
                {{ topic.name }} ({{ topic.subject.name }})
            </option>
            {% endfor %}
            {% if untagged_count > 0 %}
            <option value="none" {% if selected_topic_id == "none" %}selected{% endif %}>
                No Topic Assigned ({{ untagged_count }} {{ untagged_noun }})
            </option>
            {% endif %}
        </select>
    </div>
</div>
