{% comment %}
  Shared by the new-check form and the scans page. Needs classes, solutions,
  max_solution_pages and carried in the context, and #classSelect on the page.
{% endcomment %}
<script>
(function () {
  var rosters = {
    {% for c in classes %}
      "{{ c.id }}": [{% for s in c.students.all %}{"id": {{ s.id }}, "name": "{{ s.get_full_name|default:s.username|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]{% if not forloop.last %},{% endif %}
    {% endfor %}
  };

  /* Which exercise sits on which pages, per solution PDF. Detected from the
     running header when the PDF was first opened here. */
  var sections = {
    {% for s in solutions %}
      "{{ s.id }}": [{% for sec in s.sections.all %}{"label": "{{ sec.label|escapejs }}", "range": "{{ sec.page_range }}", "pages": {{ sec.page_count }}}{% if not forloop.last %},{% endif %}{% endfor %}]{% if not forloop.last %},{% endif %}
    {% endfor %}
  };

  var maxPages = {{ max_solution_pages }};
  var carriedPages = "{{ carried.pages|default:''|escapejs }}";
  var exerciseName = document.getElementById('exerciseName');

  /* The name is filled from the section picked, but must never overwrite
     something the teacher typed -- "Ex 1.1 Q1-8" is the whole point of the
     field being editable. So we only replace a value this script wrote. */
  var autoFilled = exerciseName ? exerciseName.value : '';

  function nameFromSection(label) {
    if (!exerciseName) return;
    if (exerciseName.value && exerciseName.value !== autoFilled) return;
    exerciseName.value = label;
    autoFilled = label;
  }

  var classSelect = document.getElementById('classSelect');
  if (!classSelect) return;

  /* Every student picker on the page follows the class: one on the new-check
     form, one per scan on the scans page. A picker with data-roster-blank
     starts on that blank option instead of the first student, which is how a
     scan is left unassigned. */
  function fillStudents() {
    var list = rosters[classSelect.value] || [];
    document.querySelectorAll('select[data-roster]').forEach(function (studentSelect) {
      var blank = studentSelect.getAttribute('data-roster-blank');
      studentSelect.innerHTML = '';
      if (blank !== null) {
        var none = document.createElement('option');
        none.value = '';
        none.textContent = blank;
        studentSelect.appendChild(none);
      }
      list.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        studentSelect.appendChild(opt);
      });
      if (!list.length && blank === null) {
        var opt = document.createElement('option');
        opt.textContent = 'No students enrolled in this class';
        opt.disabled = true;
        studentSelect.appendChild(opt);
      }
    });
  }

  classSelect.addEventListener('change', fillStudents);
  fillStudents();

  /* ---- Exercises -> page range --------------------------------------- */
  /* A homework often spans several exercises (2.1, 2.2 and 2.3), so they are
     ticked rather than picked. Ticking writes their pages, merged, into the
     page box; the box stays editable so a long run can be trimmed to the
     questions actually set. The box is what gets posted. */
  var solutionSelect = document.getElementById('solutionSelect');
  var sectionPicker = document.getElementById('sectionPicker');
  var sectionList = document.getElementById('sectionList');
  var pagesInput = document.getElementById('pagesInput');
  var pagesHint = document.getElementById('pagesHint');
  if (!solutionSelect || !sectionList) return;

  /* Read the way parse_page_range reads it on the server, so the count shown
     is the count that will be sent. Sorted, and a page shared by two
     exercises counts once. */
  function parsePages(spec) {
    var seen = {};
    String(spec).replace(/\s+/g, '').split(',').forEach(function (chunk) {
      var m = chunk.match(/^(\d+)-(\d+)$/);
      if (m) {
        for (var p = +m[1]; p <= +m[2]; p++) seen[p] = true;
      } else if (/^\d+$/.test(chunk)) {
        seen[+chunk] = true;
      }
    });
    return Object.keys(seen).map(Number).filter(function (p) { return p >= 1; })
      .sort(function (a, b) { return a - b; });
  }

  // [3, 4, 5, 9, 11, 12] -> "3-5,9,11-12"
  function compress(pages) {
    var out = [];
    for (var i = 0; i < pages.length; i++) {
      var j = i;
      while (j + 1 < pages.length && pages[j + 1] === pages[j] + 1) j++;
      out.push(i === j ? String(pages[i]) : pages[i] + '-' + pages[j]);
      i = j;
    }
    return out.join(',');
  }

  // "Exercise 2.1", "Exercise 2.2" -> "Exercise 2.1, 2.2"
  function joinLabels(labels) {
    if (labels.length < 2) return labels[0] || '';
    var word = labels[0].split(' ')[0] + ' ';
    var shared = labels.every(function (l) {
      return l.indexOf(word) === 0 && l.length > word.length;
    });
    if (!shared) return labels.join(', ');
    return word + labels.map(function (l) { return l.slice(word.length); }).join(', ');
  }

  function boxes() {
    return Array.prototype.slice.call(sectionList.querySelectorAll('input[type=checkbox]'));
  }

  function fillSections() {
    var list = sections[solutionSelect.value] || [];
    sectionList.innerHTML = '';
    sectionPicker.classList.toggle('hidden', !list.length);
    // Blank would send the whole PDF. With exercises to tick, that is never
    // what was meant; without them, it is the only option there was before.
    pagesInput.required = list.length > 0;

    list.forEach(function (sec, i) {
      var row = document.createElement('label');
      row.className = 'flex cursor-pointer items-center gap-3 px-3 py-2 text-sm text-twilight'
        + (i < list.length - 1 ? ' border-b border-twilight/10' : '');
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.className = 'h-5 w-5 shrink-0 accent-midnight';
      box.dataset.range = sec.range;
      box.dataset.label = sec.label;
      box.addEventListener('change', applySections);
      var name = document.createElement('span');
      name.className = 'flex-1';
      name.textContent = sec.label;
      var pages = document.createElement('span');
      pages.className = 'text-xs text-twilight/50';
      pages.textContent = 'pp. ' + sec.range;
      row.appendChild(box);
      row.appendChild(name);
      row.appendChild(pages);
      sectionList.appendChild(row);
    });

    /* Carried over from the last student's check. The pages stand exactly as
       they were -- they are what the teacher chose, perhaps trimmed by hand --
       and the exercises lying wholly inside them are ticked to show where
       they came from. */
    if (carriedPages) {
      var carried = parsePages(carriedPages);
      boxes().forEach(function (box) {
        box.checked = parsePages(box.dataset.range).every(function (p) {
          return carried.indexOf(p) !== -1;
        });
      });
      pagesInput.value = carriedPages;
      carriedPages = '';
      showCount();
    } else {
      applySections();
    }
  }

  function applySections() {
    var ticked = boxes().filter(function (b) { return b.checked; });
    pagesInput.value = compress(parsePages(
      ticked.map(function (b) { return b.dataset.range; }).join(',')));
    nameFromSection(joinLabels(ticked.map(function (b) { return b.dataset.label; })));
    showCount();
  }

  function showCount() {
    var spec = pagesInput.value.trim();
    var count = parsePages(spec).length;
    var warn = true;
    var block = false;

    if (!spec) {
      pagesHint.textContent = pagesInput.required
        ? 'Tick the exercises you set, or type the pages yourself.'
        : 'Give the pages covering this homework, e.g. 17-21, 24. At most '
          + maxPages + ' pages.';
      warn = false;
    } else if (!count) {
      // The server would read this as blank, and send the whole PDF.
      pagesHint.textContent = "Those pages can't be read. Use numbers and ranges, "
        + 'e.g. 17-21, 24.';
      block = true;
    } else if (spec.length > 60) {
      // The field holds 60 characters, and the server would cut the rest off.
      pagesHint.textContent = 'That list of pages is too long to save. Join up '
        + 'neighbouring pages into ranges, e.g. 17-21 rather than 17,18,19,20,21.';
      block = true;
    } else if (count > maxPages) {
      // These pages are re-sent with every batch of photos, so a long
      // homework is the expensive case, not a cosmetic one.
      pagesHint.textContent = 'That is ' + count + ' pages, over the limit of '
        + maxPages + '. Take out the pages for questions you did not set.';
    } else {
      pagesHint.textContent = count + ' page(s) of solutions will be checked against.';
      warn = false;
    }
    pagesHint.className = warn ? 'mt-1 text-xs font-semibold text-rose-pop'
                               : 'mt-1 text-xs text-twilight/50';
    // Too long and unreadable would each save something other than what was
    // typed, so the form won't submit them. Over the page limit still can:
    // the server refuses it with its own explanation, as before.
    pagesInput.setCustomValidity(block ? pagesHint.textContent : '');
  }

  solutionSelect.addEventListener('change', fillSections);
  pagesInput.addEventListener('input', showCount);
  fillSections();
})();
</script>
