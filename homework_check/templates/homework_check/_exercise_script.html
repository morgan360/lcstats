{% comment %}
  Shared by the new-check form and the scans page. Needs classes, solutions,
  max_solution_pages and carried in the context, and #classSelect on the page.
{% endcomment %}
<script>
(function () {
  var rosters = {
    {% for c in classes %}
      "{{ c.id }}": [{% for s in c.students.all %}{"id": {{ s.id }}, "name": "{{ s.get_full_name|default:s.username|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]{% if not forloop.last %},{% endif %}
    {% endfor %}
  };

  /* Which exercise sits on which pages, per solution PDF. Detected from the
     running header when the PDF was first opened here. */
  var sections = {
    {% for s in solutions %}
      "{{ s.id }}": [{% for sec in s.sections.all %}{"label": "{{ sec.label|escapejs }}", "range": "{{ sec.page_range }}", "pages": {{ sec.page_count }}}{% if not forloop.last %},{% endif %}{% endfor %}]{% if not forloop.last %},{% endif %}
    {% endfor %}
  };

  var maxPages = {{ max_solution_pages }};
  var carriedPages = "{{ carried.pages|default:''|escapejs }}";
  var exerciseName = document.getElementById('exerciseName');

  /* The name is filled from the section picked, but must never overwrite
     something the teacher typed -- "Ex 1.1 Q1-8" is the whole point of the
     field being editable. So we only replace a value this script wrote. */
  var autoFilled = exerciseName ? exerciseName.value : '';

  function nameFromSection(label) {
    if (!exerciseName || !label) return;
    if (exerciseName.value && exerciseName.value !== autoFilled) return;
    exerciseName.value = label;
    autoFilled = label;
  }

  var classSelect = document.getElementById('classSelect');
  if (!classSelect) return;

  /* Every student picker on the page follows the class: one on the new-check
     form, one per scan on the scans page. A picker with data-roster-blank
     starts on that blank option instead of the first student, which is how a
     scan is left unassigned. */
  function fillStudents() {
    var list = rosters[classSelect.value] || [];
    document.querySelectorAll('select[data-roster]').forEach(function (studentSelect) {
      var blank = studentSelect.getAttribute('data-roster-blank');
      studentSelect.innerHTML = '';
      if (blank !== null) {
        var none = document.createElement('option');
        none.value = '';
        none.textContent = blank;
        studentSelect.appendChild(none);
      }
      list.forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        studentSelect.appendChild(opt);
      });
      if (!list.length && blank === null) {
        var opt = document.createElement('option');
        opt.textContent = 'No students enrolled in this class';
        opt.disabled = true;
        studentSelect.appendChild(opt);
      }
    });
  }

  classSelect.addEventListener('change', fillStudents);
  fillStudents();

  /* ---- Exercise -> page range ---------------------------------------- */
  var solutionSelect = document.getElementById('solutionSelect');
  var sectionSelect = document.getElementById('sectionSelect');
  var pagesField = document.getElementById('pagesField');
  var pagesManual = document.getElementById('pagesManual');
  var pagesInput = document.getElementById('pagesInput');
  var pagesHint = document.getElementById('pagesHint');
  if (!solutionSelect || !sectionSelect) return;

  function fillSections() {
    var list = sections[solutionSelect.value] || [];
    sectionSelect.innerHTML = '';

    list.forEach(function (sec) {
      var opt = document.createElement('option');
      opt.value = sec.range;
      opt.dataset.pages = sec.pages;
      opt.dataset.label = sec.label;
      opt.textContent = sec.label + '  (pages ' + sec.range + ')';
      sectionSelect.appendChild(opt);
    });

    var other = document.createElement('option');
    other.value = '__manual__';
    other.textContent = list.length ? 'Other — type the pages myself'
                                    : 'Type the pages myself';
    sectionSelect.appendChild(other);

    if (!list.length) sectionSelect.value = '__manual__';

    /* Carried over from the last student's check. A range the PDF no longer
       has a section for still stands -- it goes in the manual box rather
       than being dropped, because it is what the teacher chose. */
    if (carriedPages) {
      var matched = false;
      for (var i = 0; i < sectionSelect.options.length; i++) {
        if (sectionSelect.options[i].value === carriedPages) {
          sectionSelect.selectedIndex = i;
          matched = true;
          break;
        }
      }
      if (!matched) {
        sectionSelect.value = '__manual__';
        pagesInput.value = carriedPages;
      }
      carriedPages = '';
    }

    applySection();
  }

  function applySection() {
    var manual = sectionSelect.value === '__manual__';
    pagesManual.classList.toggle('hidden', !manual);

    if (manual) {
      pagesField.value = pagesInput.value.trim();
      pagesHint.textContent = 'Give the pages covering this exercise, e.g. 17-21. '
        + 'At most ' + maxPages + ' pages.';
      pagesHint.className = 'mt-1 text-xs text-twilight/50';
      return;
    }

    pagesField.value = sectionSelect.value;
    var opt = sectionSelect.options[sectionSelect.selectedIndex];
    var count = parseInt(opt && opt.dataset.pages, 10) || 0;
    nameFromSection(opt && opt.dataset.label);

    if (count > maxPages) {
      // These pages are re-sent with every batch of photos, so a long
      // exercise is the expensive case, not a cosmetic one.
      pagesHint.textContent = 'That exercise runs to ' + count + ' pages, over the '
        + 'limit of ' + maxPages + '. Type a narrower range covering just the '
        + 'questions you set.';
      pagesHint.className = 'mt-1 text-xs font-semibold text-rose-pop';
    } else {
      pagesHint.textContent = count + ' page(s) of solutions will be checked against.';
      pagesHint.className = 'mt-1 text-xs text-twilight/50';
    }
  }

  solutionSelect.addEventListener('change', fillSections);
  sectionSelect.addEventListener('change', applySection);
  pagesInput.addEventListener('input', applySection);
  fillSections();
})();
</script>
