{% load static %}
{# NumSkull - floating site-wide mascot. Override {% block mascot %}{% endblock %} on pages where it should be hidden (e.g. full timed exam). #}
<div id="numskull" class="numskull" data-state="idle" aria-live="polite">
    <button type="button" id="numskull-toggle" class="numskull__toggle" aria-label="Get AI help from NumSkull" aria-expanded="false">
        <span class="numskull__badge" aria-hidden="true">AI</span>
        <span class="numskull__tip" id="numskull-tip" aria-hidden="true">AI help — ask me</span>
        <svg class="numskull__char" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <radialGradient id="numskullHead" cx="50%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#bff3ff" stop-opacity="0.95"/>
                    <stop offset="60%" stop-color="#7ad7ff" stop-opacity="0.55"/>
                    <stop offset="100%" stop-color="#4aa8ff" stop-opacity="0.25"/>
                </radialGradient>
                <filter id="numskullGlow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="3" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>

            {# Body - small rounded base #}
            <ellipse cx="60" cy="120" rx="26" ry="8" fill="#000" opacity="0.25"/>
            <path d="M40 112 Q40 95 60 95 Q80 95 80 112 Z" fill="#4aa8ff" opacity="0.55"/>

            {# Head - translucent holographic orb #}
            <circle cx="60" cy="60" r="42" fill="url(#numskullHead)" stroke="#bff3ff" stroke-width="1.5" stroke-opacity="0.7" filter="url(#numskullGlow)"/>

            {# Eyes - dark navy for contrast against the light orb #}
            <circle cx="46" cy="58" r="3.5" fill="#0b1230"/>
            <circle cx="74" cy="58" r="3.5" fill="#0b1230"/>

            {# √i in the middle of the head, dark navy so it reads clearly #}
            <g transform="translate(60 76)" font-family="'Times New Roman', serif" font-style="italic" fill="#0b1230">
                <text text-anchor="middle" font-size="28" font-weight="bold" stroke="#0b1230" stroke-width="0.6">√<tspan font-style="italic">i</tspan></text>
            </g>
        </svg>
    </button>

    <div id="numskull-panel" class="numskull__panel" role="dialog" aria-label="NumSkull helper" hidden>
        <div class="numskull__panel-head">
            <span class="numskull__name">NumSkull</span>
            <span class="numskull__tag">AI · unreal</span>
            <button type="button" class="numskull__close" id="numskull-close" aria-label="Close NumSkull">×</button>
        </div>
        <p class="numskull__msg" id="numskull-msg">I'm the AI tutor. A bit imaginary, but I can help for real.</p>
        <div class="numskull__actions">
            <a href="{% url 'chat_view' %}" id="numskull-primary" class="numskull__btn numskull__btn--primary">Ask the AI</a>
            <button type="button" class="numskull__btn numskull__btn--ghost" id="numskull-hide-session">Hide for now</button>
        </div>
    </div>
</div>

<style>
    .numskull {
        position: fixed;
        left: 1.25rem;
        top: 5rem;
        z-index: 1100;
        font-family: inherit;
    }
    .numskull[hidden] { display: none; }

    .numskull__toggle {
        position: relative;
        width: 72px;
        height: 84px;
        padding: 0;
        background: transparent;
        border: none;
        cursor: pointer;
        filter: drop-shadow(0 6px 14px rgba(74, 168, 255, 0.45));
        animation: numskull-bob 4s ease-in-out infinite;
    }
    .numskull__badge {
        position: absolute;
        top: -4px;
        right: -6px;
        min-width: 28px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: #ff5d8f;
        color: #fff;
        font-weight: 800;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        line-height: 22px;
        text-align: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        border: 2px solid #0b1230;
        z-index: 2;
    }
    .numskull__tip {
        position: absolute;
        left: calc(100% + 6px);
        top: 22px;
        background: #0b1230;
        color: #f0f6ff;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        white-space: nowrap;
        border: 1px solid rgba(191, 243, 255, 0.3);
        pointer-events: none;
        opacity: 0;
        transform: translateX(-6px);
        transition: opacity 0.2s, transform 0.2s;
    }
    .numskull__tip::after {
        content: "";
        position: absolute;
        left: -5px;
        top: 9px;
        width: 8px;
        height: 8px;
        background: inherit;
        border-left: 1px solid rgba(191, 243, 255, 0.3);
        border-bottom: 1px solid rgba(191, 243, 255, 0.3);
        transform: rotate(45deg);
    }
    .numskull__toggle:hover .numskull__tip,
    .numskull__toggle:focus-visible .numskull__tip,
    .numskull[data-hint="1"] .numskull__tip {
        opacity: 1;
        transform: translateX(0);
    }
    .numskull__toggle:focus-visible {
        outline: 2px solid #bff3ff;
        outline-offset: 4px;
        border-radius: 999px;
    }
    .numskull__char { width: 100%; height: 100%; }

    @keyframes numskull-bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
        .numskull__toggle { animation: none; }
    }

    .numskull__panel {
        position: absolute;
        left: 0;
        top: 96px;
        width: 18rem;
        padding: 0.9rem 1rem 1rem;
        border-radius: 14px;
        background: rgba(18, 22, 48, 0.92);
        color: #f0f6ff;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(191, 243, 255, 0.25);
    }
    .numskull__panel[hidden] { display: none; }
    .numskull__panel::after {
        content: "";
        position: absolute;
        left: 22px;
        top: -8px;
        width: 16px;
        height: 16px;
        background: inherit;
        border-left: 1px solid rgba(191, 243, 255, 0.25);
        border-top: 1px solid rgba(191, 243, 255, 0.25);
        transform: rotate(45deg);
    }
    .numskull__panel-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.4rem;
    }
    .numskull__name { font-weight: 700; font-size: 0.95rem; }
    .numskull__tag {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(191, 243, 255, 0.15);
        color: #bff3ff;
    }
    .numskull__close {
        margin-left: auto;
        background: transparent;
        border: none;
        color: #f0f6ff;
        font-size: 1.4rem;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
    }
    .numskull__msg { margin: 0 0 0.75rem; font-size: 0.9rem; line-height: 1.35; }
    .numskull__actions { display: flex; gap: 0.5rem; }
    .numskull__btn {
        flex: 1;
        text-align: center;
        padding: 0.45rem 0.7rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .numskull__btn--primary { background: #4aa8ff; color: #0b1230; }
    .numskull__btn--primary:hover { filter: brightness(1.08); }
    .numskull__btn--ghost {
        background: transparent;
        color: #bff3ff;
        border-color: rgba(191, 243, 255, 0.4);
    }
    .numskull__btn--ghost:hover { background: rgba(191, 243, 255, 0.1); }

    @media (max-width: 480px) {
        .numskull { left: 0.75rem; top: 4.25rem; }
        .numskull__toggle { width: 60px; height: 70px; }
        .numskull__panel { width: 16rem; top: 80px; }
    }
</style>

<script>
    (function () {
        var root = document.getElementById('numskull');
        if (!root) return;
        var toggle = document.getElementById('numskull-toggle');
        var panel = document.getElementById('numskull-panel');
        var closeBtn = document.getElementById('numskull-close');
        var hideBtn = document.getElementById('numskull-hide-session');
        var msg = document.getElementById('numskull-msg');
        var primary = document.getElementById('numskull-primary');
        var tip = document.getElementById('numskull-tip');

        if (sessionStorage.getItem('numskull-hidden') === '1') {
            root.hidden = true;
            return;
        }

        // Topic-aware infobot inputs on question pages:
        //   #infobot-query        -> interactive_lessons quiz template
        //   #exam-infobot-query   -> exam_papers practice question interface
        var infobot = document.getElementById('infobot-query')
            || document.getElementById('exam-infobot-query');

        if (infobot) {
            msg.textContent = "There's a question-aware AI helper on this page — want me to jump you to it?";
            primary.textContent = 'Take me there';
            primary.setAttribute('href', '#' + infobot.id);
            if (tip) tip.textContent = 'Ask AI about this question';
        }

        function focusInfobot() {
            infobot.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(function () { infobot.focus({ preventScroll: true }); }, 350);
        }

        function setOpen(open) {
            panel.hidden = !open;
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        toggle.addEventListener('click', function () {
            if (infobot) {
                focusInfobot();
                return;
            }
            setOpen(panel.hidden);
        });

        if (primary && infobot) {
            primary.addEventListener('click', function (e) {
                e.preventDefault();
                setOpen(false);
                focusInfobot();
            });
        }

        closeBtn.addEventListener('click', function () { setOpen(false); });
        hideBtn.addEventListener('click', function () {
            sessionStorage.setItem('numskull-hidden', '1');
            root.hidden = true;
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !panel.hidden) setOpen(false);
        });

        // Show the "Need help?" tip briefly on first load so the affordance is discoverable.
        if (!sessionStorage.getItem('numskull-tip-shown')) {
            root.setAttribute('data-hint', '1');
            setTimeout(function () {
                root.removeAttribute('data-hint');
                sessionStorage.setItem('numskull-tip-shown', '1');
            }, 3500);
        }
    })();
</script>
