{% if messages %}
<div class="mb-4 space-y-2">
    {% for message in messages %}
    <div class="flex items-start justify-between gap-3 rounded-xl px-4 py-3 text-sm font-medium shadow-sm
        {% if message.tags == 'error' %}bg-rose-pop/10 text-rose-pop{% elif message.tags == 'success' %}bg-lime-glow/20 text-midnight{% else %}bg-twilight/10 text-midnight{% endif %}">
        <span>{{ message }}</span>
        <button type="button" class="font-bold opacity-60 hover:opacity-100" onclick="this.parentElement.remove()" aria-label="Dismiss">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
